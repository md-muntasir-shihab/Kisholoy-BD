    <script>
      /* Day (Light) theme is always the default for both storefront and admin */
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('kisholoy-theme'); } catch (e) {}
        if (stored === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
